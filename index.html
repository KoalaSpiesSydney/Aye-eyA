<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

  <title>Aye eyA</title>

  <style>
    @font-face {
      font-family: 'Angilla Tattoo';
      src: url('fonts/AngillaTattoo.ttf') format('truetype');
    }


.track h2 {
  font-family: "Black Ops One", sans-serif;
}



    html, body {
      margin: 0;
      padding: 0;
      height: auto; /* iframe-safe */
      font-family: Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    /* Background video */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.8;
    }

    /* Main container */
    .site-content {
      position: relative;
      z-index: 1;
      background: rgba(0,0,0,0.5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    /* Title + canvas */
    .title-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 8%;
    }

    #electric-visual {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

   .title-wrapper h1 {
  position: relative;
  z-index: 1;
  font-family: "Sedgwick Ave", system-ui, sans-serif;
  color: #efebeb;
  opacity: 0.9;
  font-size: 5.6rem;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin: 5px;
  padding: 5px;
}



    /* Two-column playlist */
    .playlist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 10px;
      width: 100%;
      max-width: 420px; /* ensures two columns fit on all phones */
      margin-top: auto;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .playlist-column ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .track {
      cursor: pointer;
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #fa0404;
      border-radius: 6px;
      transition: 0.3s;
    }

    .track:hover { background: #333; }
    .track.playing { background: #ff0000; }

    .track h2 {
      font-size: 1.5rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Dark-mode footer */
    .site-footer {
      background: rgba(0, 0, 0, 0.45);
      text-align: center;
      padding: 6px 10px;
      margin-top: 50px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.55);
      width: 100%;
      max-width: 700px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .title-wrapper h1 {
        font-size: 2.4rem;
      }
    }
  </style>
</head>

<body>

  <video id="bg-video" autoplay muted loop playsinline>
    <source src="ayeeya2.mp4" type="video/mp4">
  </video>

  <div class="site-content">

    <div class="title-wrapper">
      <canvas id="electric-visual"></canvas>
      
      <h1>Aye eyA</h1>
    </div>

    <section class="playlist-grid">
      <div class="playlist-column">
        <ul>
          <li class="track" data-src="Couldabintiprison.mp3"><h2>Coulda Bin Ta Prisin</h2></li>
          <li class="track" data-src="Pigzbewhere.mp3"><h2>Pigz Be Where</h2></li>
        </ul>
      </div>

      <div class="playlist-column">
        <ul>
          <li class="track" data-src="Bugattinbitches.mp3"><h2>Bugatti n Bitches</h2></li>
          <li class="track" data-src="DontrustColombians.mp3"><h2>Colombian Conexion</h2></li>
        </ul>
      </div>
    </section>

    <footer class="site-footer">
      <p>&copy; 2025 Koala Spies Sydney <br>koalaspies@duck.com</p>
    </footer>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const audioPlayer = new Audio();
      const tracks = document.querySelectorAll('.track');
      const canvas = document.getElementById('electric-visual');
      const ctx = canvas.getContext('2d');

      let currentTrackIndex = -1;
      let isPlaying = false;
      let time = 0;

      let lastGlitch = 0;
      const glitchInterval = 4000;
      let glitchBoost = 0;

      function resizeCanvas() {
        const wrapper = document.querySelector('.title-wrapper');
        canvas.width = wrapper.offsetWidth;
        canvas.height = wrapper.offsetHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function drawStillLines() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawStraightLine(canvas.height / 3);
        drawStraightLine((canvas.height / 3) * 2);
      }

      function drawStraightLine(y) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.strokeStyle = "rgba(255,0,0,0.9)";
        ctx.lineWidth = 2;
        ctx.shadowColor = "red";
        ctx.shadowBlur = 12;
        ctx.stroke();
      }

      function drawWave(offset, yOffset, frequency, amplitude) {
        ctx.beginPath();
        ctx.moveTo(0, yOffset);

        for (let x = 0; x <= canvas.width; x += 6) {
          const glitch = (Math.random() - 0.5) * 6;
          const y =
            yOffset +
            Math.sin((x / frequency) - time + offset) * amplitude +
            glitch +
            glitchBoost;
          ctx.lineTo(x, y);
        }

        ctx.strokeStyle = "rgba(255,0,0,0.9)";
        ctx.lineWidth = 2;
        ctx.shadowColor = "red";
        ctx.shadowBlur = 20;
        ctx.stroke();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const now = performance.now();
        if (isPlaying && now - lastGlitch > glitchInterval) {
          glitchBoost = (Math.random() - 0.5) * 40;
          lastGlitch = now;
          setTimeout(() => { glitchBoost = 0; }, 200);
        }

        if (isPlaying) {
          drawWave(0, canvas.height / 4, 35, 15);
          drawWave(2, canvas.height / 2, 50, 20);
          drawWave(4, (canvas.height / 4) * 3, 70, 25);
          time += 0.15;
        } else {
          drawStillLines();
        }

        requestAnimationFrame(animate);
      }
      animate();

      function playTrack(index) {
        const track = tracks[index];

        if (currentTrackIndex === index && !audioPlayer.paused) {
          audioPlayer.pause();
          isPlaying = false;
          track.classList.remove('playing');
          return;
        }

        tracks.forEach(t => t.classList.remove('playing'));
        audioPlayer.src = track.dataset.src;
        audioPlayer.play();
        isPlaying = true;
        currentTrackIndex = index;
        track.classList.add('playing');
      }

      tracks.forEach((track, i) => {
        track.addEventListener('click', () => playTrack(i));
      });

      audioPlayer.addEventListener('ended', () => {
        if (currentTrackIndex >= 0) {
          tracks[currentTrackIndex].classList.remove('playing');
        }
        isPlaying = false;
      });
    });
  </script>

</body>
</html>
